<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Number Guessing Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-box">
    <h1>🎯 Number Guessing Game</h1>
    <p>Guess the secret number within limited attempts!</p>

    <!-- Difficulty Selection -->
    <div class="level-box">
      <label><b>Select Difficulty:</b></label><br>
      <input type="radio" name="difficulty" value="easy" id="diff-easy" checked> <label for="diff-easy">Easy (1-50, 10 tries)</label><br>
      <input type="radio" name="difficulty" value="medium" id="diff-med"> <label for="diff-med">Medium (1-100, 7 tries)</label><br>
      <input type="radio" name="difficulty" value="hard" id="diff-hard"> <label for="diff-hard">Hard (1-200, 5 tries)</label>
    </div>

    <!-- Status -->
    <div class="status-box">
      <p>Attempts Remaining: <span id="attempts-left">10</span></p>
      <p>Current Score: <span id="user-score">100</span></p>
    </div>

    <!-- User Input -->
    <div class="input-section">
      <input type="number" id="guess-input" placeholder="Enter your guess">
      <button onclick="checkGuess()" id="guess-btn">Submit Guess</button>
    </div>

    <!-- Message & Hint -->
    <div id="message" class="msg-box">Choose a difficulty and start guessing!</div>

    <!-- Previous Guesses -->
    <p>Previous Guesses: <span id="prev-guesses">None</span></p>

    <!-- Play Again -->
    <button onclick="restartGame()" class="restart-btn" id="restart-btn" style="display:none;">Play Again 🔄</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
