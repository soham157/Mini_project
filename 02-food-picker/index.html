<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Food Picker</title><link rel="stylesheet" href="style.css"></head><body><main class="app">
<section class="card"><h1>🍽️ What Should I Eat?</h1><p class="sub">Can't decide? Pick a meal and a food type and let us choose for you.</p>
<div class="row"><div><label for="meal">Meal</label><select id="meal"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snacks</option></select></div>
<div><label for="type">Food type</label><select id="type"><option value="all">Any</option><option value="veg">Vegetarian</option><option value="nonveg">Non-Vegetarian</option></select></div></div><br>
<div class="row"><button id="pick">Pick My Food</button><button id="challenge" class="alt">🎲 Random Challenge</button></div></section>
<section id="out" class="card hidden"><div id="emoji" style="font-size:5rem;text-align:center"></div><h2 id="name" style="text-align:center"></h2><p class="sub" id="desc" style="text-align:center"></p><p style="text-align:center"><span class="pill" id="tag"></span></p><br>
<div class="row"><button id="another">Try Another</button><button id="fav" class="alt">❤️ Add to Favourites</button></div></section>
<section class="card"><h2>❤️ Favourites</h2><ul id="favs" style="list-style:none;line-height:2"></ul><p class="sub" id="noFav">Nothing saved yet.</p></section>
</main><script src="script.js"></script></body></html>
