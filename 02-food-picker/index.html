<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Food Picker - What Should I Eat?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🍽️ Food Picker</h1>
    <p>Can't decide what to eat? Let this tool help you pick your meal!</p>

    <!-- Filters -->
    <div class="filter-box">
      <label><b>Meal Category:</b></label>
      <select id="meal-category">
        <option value="all">Any Category (Surprise Me)</option>
        <option value="breakfast" selected>Breakfast</option>
        <option value="lunch">Lunch</option>
        <option value="snacks">Evening Snacks</option>
        <option value="dinner">Dinner</option>
      </select>

      <br><br>
      <label><b>Diet Preference:</b></label>
      <input type="radio" name="diet" value="all" id="diet-all" checked> <label for="diet-all">All</label>
      <input type="radio" name="diet" value="veg" id="diet-veg"> <label for="diet-veg">Veg</label>
      <input type="radio" name="diet" value="non-veg" id="diet-nonveg"> <label for="diet-nonveg">Non-Veg</label>
    </div>

    <!-- Action Button -->
    <button onclick="suggestFood()" class="main-btn">🎲 Suggest My Food</button>

    <!-- Food Result Card -->
    <div class="food-card" id="food-card">
      <div id="food-emoji" class="food-icon">🍲</div>
      <h2 id="food-name">Click Suggest to Start!</h2>
      <p id="food-type-badge" class="badge">Category</p>
      <p id="food-desc">Your recommended dish details will show up here.</p>
      <p><b>Main Ingredients:</b> <span id="food-ingredients">-</span></p>
      <button onclick="addToFavorites()" class="fav-btn">❤️ Add to Favorites</button>
    </div>

    <!-- Favorites Section -->
    <div class="fav-section">
      <h3>My Favorite Dishes</h3>
      <ul id="favorites-list">
        <li>No favorites added yet.</li>
      </ul>
      <button onclick="clearFavorites()" class="clear-btn">Clear Favorites</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
