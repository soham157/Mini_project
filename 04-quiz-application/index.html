<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quiz Application</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="quiz-box">
    <h1>📝 Student Quiz App</h1>

    <!-- Category Screen -->
    <div id="category-screen">
      <p>Select a subject category to start the quiz:</p>
      <button onclick="startQuiz('gk')" class="cat-btn">🌍 General Knowledge</button>
      <button onclick="startQuiz('science')" class="cat-btn">🔬 Science</button>
      <button onclick="startQuiz('cs')" class="cat-btn">💻 Computer Science</button>
    </div>

    <!-- Question Screen -->
    <div id="question-screen" style="display:none;">
      <div class="quiz-header">
        <span id="question-count">Question 1 of 5</span>
        <span id="timer" class="timer-tag">Time: 60s</span>
      </div>

      <h3 id="question-text">Question goes here</h3>

      <div id="options-box" class="options-box">
        <!-- Radio options injected here -->
      </div>

      <div class="nav-buttons">
        <button onclick="prevQuestion()" id="prev-btn">Previous</button>
        <button onclick="nextQuestion()" id="next-btn">Next</button>
        <button onclick="submitQuiz()" id="submit-btn" style="display:none; background:#38a169;">Submit Quiz</button>
      </div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" style="display:none;">
      <h2>Quiz Results 🏆</h2>
      <p class="final-score">Your Score: <span id="score-text">0 / 5</span> (<span id="percentage-text">0%</span>)</p>
      <p>Correct Answers: <b id="correct-count">0</b></p>
      <p>Incorrect Answers: <b id="wrong-count">0</b></p>
      <p>Unanswered Questions: <b id="unanswered-count">0</b></p>

      <button onclick="restartQuiz()" class="cat-btn" style="margin-top:15px;">Take Another Quiz 🔄</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
