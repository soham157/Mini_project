<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Daily Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>💰 Daily Expense Tracker</h1>
    <p>Keep track of your everyday spending easily.</p>

    <!-- Summary KPI Cards -->
    <div class="kpi-row">
      <div class="kpi-card">
        <small>Total Spent</small>
        <h2 id="total-val">₹0</h2>
      </div>
      <div class="kpi-card">
        <small>Highest Expense</small>
        <h2 id="highest-val">₹0</h2>
      </div>
      <div class="kpi-card">
        <small>Top Category</small>
        <h2 id="top-cat-val">-</h2>
      </div>
    </div>

    <!-- Add Expense Form -->
    <div class="form-card">
      <h3>Add New Expense</h3>
      <form onsubmit="addExpense(event)">
        <input type="text" id="exp-name" placeholder="Expense Name (e.g. Bus Ticket, Lunch)" required>
        <select id="exp-category" required>
          <option value="Food">Food</option>
          <option value="Travel">Travel</option>
          <option value="Shopping">Shopping</option>
          <option value="Education">Education</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Others">Others</option>
        </select>
        <input type="number" id="exp-amount" min="1" placeholder="Amount (₹)" required>
        <input type="date" id="exp-date" required>
        <button type="submit" class="add-btn">Add Expense</button>
      </form>
    </div>

    <!-- Filter & Table -->
    <div class="table-card">
      <div class="table-header">
        <h3>Expense History</h3>
        <select id="filter-cat" onchange="renderTable()">
          <option value="all">All Categories</option>
          <option value="Food">Food</option>
          <option value="Travel">Travel</option>
          <option value="Shopping">Shopping</option>
          <option value="Education">Education</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Others">Others</option>
        </select>
      </div>

      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Name</th>
            <th>Category</th>
            <th>Amount</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="expense-list">
          <!-- Expense rows -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
