<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guess the Movie</title><link rel="stylesheet" href="style.css"></head><body><main class="app">
<section id="welcome" class="card"><h1>🎬 Guess the Movie</h1><p class="sub">Look at the picture clues and pick the right movie. Use a hint if you're stuck — but it costs points.</p><label for="cat">Category</label><select id="cat"></select><br><br><button id="go">Start Game</button></section>
<section id="game" class="card hidden"><div class="row"><span class="pill" id="prog"></span><span class="pill" id="score"></span><span class="pill" id="timer"></span></div>
<div id="clue" class="clue"></div><p class="sub" id="hint"></p><div id="opts"></div><p id="fb" class="msg"></p><div class="row"><button class="alt" id="hbtn">💡 Hint (-5)</button><button id="next" class="hidden">Next</button></div></section>
<section id="result" class="card hidden"><h1 id="rt"></h1><p class="sub" id="rs"></p><button id="again">Play Again</button></section></main><script src="script.js"></script></body></html>
