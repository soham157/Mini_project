<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Outfit Planner</title><link rel="stylesheet" href="style.css"></head><body><main class="app">
<section id="welcome" class="card"><h1>👗 What Should I Wear Today?</h1><p class="sub">Choose an occasion and weather, then generate an outfit or build your own.</p>
<div class="row"><div><label for="occ">Occasion</label><select id="occ"></select></div><div><label for="wx">Weather</label><select id="wx"><option value="">Any</option><option value="hot">Hot ☀️</option><option value="cold">Cold ❄️</option><option value="rain">Rainy 🌧️</option></select></div></div><br>
<div class="row"><button id="gen">✨ Generate Outfit</button><button id="reset" class="alt">Reset</button></div></section>
<section class="card"><h2>Your outfit</h2><div id="prev" class="grid" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr))"></div><p class="sub" id="wxTip"></p>
<div class="row"><div id="stars" aria-label="Rate outfit"></div><button id="save" class="alt">❤️ Save outfit</button></div></section>
<section class="card"><h2>Build it yourself</h2><div class="row" id="pick"></div></section>
<section class="card"><h2>Saved outfits</h2><div id="saved"></div></section></main><script src="script.js"></script></body></html>
