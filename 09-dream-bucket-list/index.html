<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dream Bucket List</title><link rel="stylesheet" href="style.css"></head><body><main class="app">
<h1>🌠 Dream Bucket List</h1><p class="sub" id="quote"></p>
<section class="card"><div class="row"><div><b id="pct">0%</b> complete — <span id="cnt">0 of 0</span></div></div><div class="track"><div id="fill"></div></div></section>
<form id="f" class="card"><h2 id="ft">Add a dream</h2><label for="t">Dream</label><input id="t" placeholder="e.g. See the northern lights"><div class="row"><div><label for="c">Category</label><select id="c"><option>Travel</option><option>Career</option><option>Learning</option><option>Adventure</option><option>Health</option><option>Personal</option></select></div>
<div><label for="p">Priority</label><select id="p"><option>High</option><option selected>Medium</option><option>Low</option></select></div><div><label for="d">Target date</label><input id="d" type="date"></div></div><p id="err" class="msg bad"></p><button>Save dream</button></form>
<section class="card"><div class="row"><input id="s" placeholder="Search dreams…" aria-label="Search"><select id="fc" aria-label="Category filter"></select><select id="fs" aria-label="Status"><option value="">All</option><option value="open">Pending</option><option value="done">Completed</option></select></div><div id="list" style="margin-top:12px"></div></section></main><script src="script.js"></script></body></html>
