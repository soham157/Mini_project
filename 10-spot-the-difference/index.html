<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spot the Difference</title><link rel="stylesheet" href="style.css"></head><body><main class="app" style="max-width:900px">
<section id="welcome" class="card"><h1>🔍 Spot the Difference</h1><p class="sub">Two pictures look the same — but they aren't. Click the differences on the right picture before time runs out.</p><button id="go">Start Level 1</button></section>
<section id="game" class="card hidden"><div class="row"><span class="pill" id="lv"></span><span class="pill" id="found"></span><span class="pill" id="timer"></span><span class="pill" id="score"></span></div>
<div class="row boards"><div id="A" class="board" aria-label="Original picture"></div><div id="B" class="board" aria-label="Picture with differences"></div></div><p id="fb" class="msg"></p><button class="alt" id="hint">💡 Hint (-10)</button></section>
<section id="result" class="card hidden"><h1 id="rt"></h1><p class="sub" id="rs"></p><button id="next">Next Level</button> <button id="again" class="alt">Restart Game</button></section></main><script src="script.js"></script></body></html>
