<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spot the Difference</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🔍 Spot the Difference Game</h1>
    <p>Observe the two pictures and click on the differences in the right picture!</p>

    <div class="hud">
      <span>Differences Found: <b id="found-count">0 / 3</b></span>
      <span>Timer: <b id="timer" style="color:red;">60s</b></span>
      <span>Score: <b id="score">0</b></span>
    </div>

    <!-- Side-by-side Images -->
    <div class="pictures-wrapper">
      <div class="pic-col">
        <small>Original Scene</small>
        <canvas id="canvas-orig" width="300" height="220"></canvas>
      </div>
      <div class="pic-col">
        <small>Find Differences Here (Click!)</small>
        <canvas id="canvas-diff" width="300" height="220" onclick="handleClick(event)"></canvas>
      </div>
    </div>

    <p id="msg-text" style="font-weight: bold; margin: 15px 0;">Look closely at the shapes, colors, and objects.</p>

    <button onclick="giveHint()" class="hint-btn">💡 Need a Hint?</button>
    <button onclick="initGame()" class="reset-btn">Restart Game 🔄</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
