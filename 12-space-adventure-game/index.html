<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Space Adventure Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <h1>🚀 Space Adventure Game</h1>
    <p>Use <b>Arrow Keys</b> to move and <b>Spacebar</b> to shoot incoming enemy ships!</p>

    <!-- Score HUD -->
    <div class="hud">
      <span>Score: <b id="score-val">0</b></span>
      <span>Lives: <b id="lives-val">❤️❤️❤️</b></span>
      <button onclick="startGame()" id="start-btn">Start Game 🕹️</button>
    </div>

    <!-- Canvas Screen -->
    <canvas id="gameCanvas" width="400" height="500"></canvas>
  </div>

  <script src="script.js"></script>
</body>
</html>
