<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Space Adventure</title><link rel="stylesheet" href="style.css"></head><body><main class="app">
<section id="welcome" class="card"><h1>🚀 Space Adventure</h1><p class="sub">Defend the galaxy! Move with ← → (or A / D), shoot with Space. On mobile use the on-screen buttons.</p><label for="lvl">Difficulty</label><select id="lvl"><option value="1">Easy</option><option value="2" selected>Medium</option><option value="3">Hard</option></select><br><br><button id="go">Start Game</button><p class="sub" style="margin-top:12px">High score: <b id="hi">0</b></p></section>
<section id="game" class="hidden"><div class="row" style="margin-bottom:8px"><span class="pill">Score <b id="sc">0</b></span><span class="pill">Lives <b id="lv"></b></span><span class="pill" id="pw"></span></div>
<canvas id="c" width="480" height="560"></canvas><div class="row pad"><button id="L">◀</button><button id="S">🔫 Fire</button><button id="R">▶</button></div></section>
<section id="over" class="card hidden"><h1>💥 Game Over</h1><p class="sub">Final score: <b id="fs"></b></p><p class="sub" id="nh"></p><button id="again">Play Again</button></section></main><script src="script.js"></script></body></html>
