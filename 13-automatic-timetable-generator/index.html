<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Automatic Timetable Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrapper">
    <h1>🗓️ Automatic Timetable Generator</h1>
    <p>Enter subjects and faculty details to generate a weekly timetable.</p>

    <!-- Academic Inputs -->
    <div class="config-box">
      <h3>Academic Setup</h3>
      <div class="form-row">
        <input type="text" id="dept-name" value="Computer Science & Engineering" placeholder="Department">
        <input type="text" id="class-name" value="B.Tech First Year" placeholder="Class / Section">
        <button onclick="generateSchedule()" class="btn-primary">⚡ Generate Timetable</button>
        <button onclick="window.print()" class="btn-print">🖨️ Print</button>
      </div>
    </div>

    <!-- Subject & Teacher Form -->
    <div class="add-box">
      <h4>Add Subject & Assigned Teacher</h4>
      <form onsubmit="addSubject(event)">
        <input type="text" id="sub-name" placeholder="Subject Name (e.g. Physics)" required>
        <input type="text" id="teach-name" placeholder="Teacher (e.g. Prof. Priya)" required>
        <input type="number" id="sub-periods" min="1" max="6" value="4" placeholder="Periods/Wk" required>
        <button type="submit" class="btn-sub">+ Add</button>
      </form>
    </div>

    <!-- Output Grid -->
    <div class="timetable-area">
      <h3 id="table-heading">Weekly Timetable - Computer Science (B.Tech First Year)</h3>
      <table border="1" id="timetable">
        <thead>
          <tr>
            <th>Day</th>
            <th>9:00 - 10:00</th>
            <th>10:00 - 11:00</th>
            <th>11:15 - 12:15</th>
            <th>12:15 - 1:15</th>
            <th>Lunch</th>
            <th>2:00 - 3:00</th>
            <th>3:00 - 4:00</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- Rows will be injected -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
