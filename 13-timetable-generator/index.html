<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Automatic Timetable Generator</title><link rel="stylesheet" href="style.css"></head><body><main class="app" style="max-width:1000px">
<h1>🗓️ Automatic Timetable Generator</h1><p class="sub">Enter your class details, subjects, teachers and rooms. The generator fills the week without clashes.</p>
<section class="card"><h2>1. Class &amp; schedule</h2><div class="row"><div><label for="cls">Class / Section</label><input id="cls" value="BTech CSE – Section A"></div><div><label for="ppd">Periods per day</label><input id="ppd" type="number" min="1" max="10" value="6"></div><div><label for="start">Start time</label><input id="start" type="time" value="09:00"></div><div><label for="dur">Period length (min)</label><input id="dur" type="number" min="20" max="120" value="50"></div></div>
<label>Working days</label><div id="days" class="row" style="gap:14px"></div></section>
<form id="sf" class="card"><h2>2. Subjects</h2><div class="row"><input id="sn" placeholder="Subject (e.g. Maths)"><input id="st" placeholder="Teacher"><input id="sr" placeholder="Classroom"><input id="sp" type="number" min="1" max="10" placeholder="Periods / week"><button>Add subject</button></div><p id="err" class="msg bad"></p><div id="slist"></div></form>
<section class="card"><div class="row"><button id="gen">⚡ Generate timetable</button><button id="regen" class="alt">🔄 Regenerate</button><button id="print" class="alt">🖨️ Print / Save PDF</button><button id="clear" class="alt">Clear all</button></div><p id="status" class="msg"></p>
<div class="row"><label style="flex:0 0 auto">View</label><select id="view"><option value="">Whole class</option></select></div><div style="overflow-x:auto;margin-top:10px"><table id="tt"></table></div><p class="sub">Tip: in the table, click a cell's drop-down to edit it manually — clashes are flagged instantly.</p></section></main><script src="script.js"></script></body></html>
